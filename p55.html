<!doctype html><html><head><meta charset="utf-8"><title>L55</title>
<style>
 body{margin:0;background:#fff;font:30px/1.05 monospace;color:#000}
 .lab{font:30px monospace;background:#000;color:#0f0;padding:1px 3px}
 .fr{border:5px solid red;width:370px;height:46px;transform:scale(2.5);transform-origin:0 0;
     display:block;background:#ffd}
 .slot{height:130px;overflow:hidden}
</style></head><body>
<div class="lab" id="hdr">boot</div>
<div class="slot"><iframe class="fr" id="f1" src="https://white-hat.api.stravito.com/api/boot"></iframe></div>
<div class="lab">A jobtitles/detailed</div>
<div class="slot"><iframe class="fr" id="f2" src="https://white-hat.api.stravito.com/api/user/job-titles/detailed"></iframe></div>
<div class="lab">B bulkupload/events</div>
<div class="slot"><iframe class="fr" id="f3" src="https://white-hat.api.stravito.com/api/bulkupload/events?limit=1"></iframe></div>
<div class="lab" id="net">net</div>
<script>
document.getElementById('hdr').textContent='L55 '+location.protocol+'//'+location.host+' ctl=/api/boot';
var T=['https://white-hat.api.stravito.com/api/boot',
       'https://white-hat.api.stravito.com/api/user/job-titles/detailed',
       'https://white-hat.api.stravito.com/api/bulkupload/events?limit=1'];
var out=[];
Promise.all(T.map(function(u,i){
  var c=new AbortController();setTimeout(function(){c.abort()},2500);
  var t0=Date.now();
  return fetch(u,{mode:'no-cors',signal:c.signal,credentials:'include'})
    .then(function(r){out[i]='ok'+(Date.now()-t0)})
    .catch(function(e){out[i]='ERR'+(Date.now()-t0)});
})).then(function(){document.getElementById('net').textContent='net '+out.join(' ')});
</script></body></html>
